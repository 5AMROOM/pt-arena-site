<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>PT Arena · กราฟิกออกอากาศ</title>
<!-- OBS Browser Source, 1920×1080, see-through. This page is only the host: it talks to obs-websocket, keeps the chosen
     theme (themes/<name>.html, see themes/CONTRACT.md) in an iframe, and hands every message from the desk to the
     theme's show(m). The desk picks the theme (hash theme=… at setup, then a 'theme' message from its dropdown);
     switching cross-fades between two iframes so the picture never goes empty.
     Address: overlay.html#ws=ws://127.0.0.1:4455&pw=<websocket password>&theme=sports&v=<build> -->
<style>
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent}
iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:transparent;opacity:0;transition:opacity .4s}
iframe.on{opacity:1}
</style>
</head>
<body>
<script>
const opt=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const THEMES=['sports','esports','minimal','thaitv','arcade','poster','blueprint','playful','cinema','light'];
let theme=THEMES.includes(opt.theme)?opt.theme:'sports',last=null,frame=null;
// a theme loads in its own iframe; once its fonts are in it gets the state on screen, then it fades in over the old one
function load(name){
  const f=document.createElement('iframe');f.setAttribute('allowtransparency','true');f.src='themes/'+name+'.html?v='+(opt.v||Date.now());
  f.onload=()=>{const w=f.contentWindow;
    const go=()=>{if(last)try{w.show(last)}catch(e){console.warn('theme',name,e)}
      // a timer, not requestAnimationFrame: a hidden page (OBS with the source inactive) never paints a frame
      setTimeout(()=>{f.classList.add('on');const old=frame;frame=f;if(old&&old!==f)setTimeout(()=>old.remove(),500)},30)};
    (w.document.fonts?w.document.fonts.ready:Promise.resolve()).then(go,go)};
  document.body.append(f);
}
function show(m){
  if(m.k==='theme'){if(m.name&&THEMES.includes(m.name)&&m.name!==theme){theme=m.name;load(theme)}return}
  if(m.k==='score'||m.k==='hello')return;
  last=m;if(frame)try{frame.contentWindow.show(m)}catch(e){console.warn('theme',theme,e)}
}
load(theme);
// obs-websocket 5: hello → identify (with the password when one is set) → listen for the desk's custom events.
// When the link drops the screen keeps what it shows; a wrong password stops the retries.
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const sha=async s=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
function connect(){
  let ws;try{ws=new WebSocket(opt.ws||'ws://127.0.0.1:4455','obswebsocket.json')}catch(e){console.warn('bad OBS address',e);return}
  ws.onmessage=async e=>{const m=JSON.parse(e.data);
    if(m.op===0){const a=m.d.authentication;const d={rpcVersion:1,eventSubscriptions:1};
      if(a)d.authentication=await sha(await sha((opt.pw||'')+a.salt)+a.challenge);ws.send(JSON.stringify({op:1,d}))}
    // once in, the desk is asked what is on; it answers with the theme and the present card
    else if(m.op===2)ws.send(JSON.stringify({op:6,d:{requestType:'BroadcastCustomEvent',requestId:'hi',requestData:{eventData:{pt:1,k:'hello'}}}}));
    else if(m.op===5&&m.d.eventType==='CustomEvent'&&m.d.eventData?.pt===1)show(m.d.eventData)};
  ws.onclose=e=>{if(e.code===4009){console.warn('OBS websocket password is wrong: run "ตั้งฉากให้ใน OBS" again');return}setTimeout(connect,2000)};
}
connect();
</script>
</body>
</html>
