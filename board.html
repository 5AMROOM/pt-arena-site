<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>PT Arena · สายการแข่ง</title>
<!-- OBS Browser Source, 1040×585: the window beside the countdown in the break scene, in place of the ads.
     The desk sends {k:'board'} through obs-websocket with the brackets already masked: a result shows only once its
     clip has been on air, so the board never gives a result away. Colours follow the theme the desk has chosen.
     Address: board.html#ws=ws://127.0.0.1:4455&pw=<websocket password>&v=<build> -->
<style>
/* Hallmark · macrostructure: Bracket board (two halves facing a centre final) · tone: broadcast, quiet · anchor hue: the chosen theme's accent */
@font-face{font-family:Prompt;src:url(font/Prompt-Regular.ttf);font-weight:400}
@font-face{font-family:Prompt;src:url(font/Prompt-Medium.ttf);font-weight:500}
@font-face{font-family:Prompt;src:url(font/Prompt-SemiBold.ttf);font-weight:600}
@font-face{font-family:Prompt;src:url(font/Prompt-Bold.ttf);font-weight:700}
@font-face{font-family:Oxanium;src:url(font/Oxanium.ttf);font-weight:200 800}
:root{--bg:#0c1a3a;--panel:#13264d;--line:#2a3d66;--ink:#fff;--mute:#8fa3c7;--accent:#e2343c;--on:#fff}
html,body{width:1040px;height:585px;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Prompt,sans-serif}
body{text-wrap:balance}
.page{position:absolute;inset:0;padding:28px 32px 24px;box-sizing:border-box;display:flex;flex-direction:column;opacity:0;transition:opacity .5s}
.page.on{opacity:1}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.hd .ey{font-family:Oxanium,Prompt;font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.hd .tt{font-weight:700;font-size:26px;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:820px}
.hd .dots{display:flex;gap:8px;padding-bottom:8px}
.hd .dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.hd .dots i.on{background:var(--accent);width:22px}
.bd{position:relative;flex:1;margin-top:18px}
svg.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.ln path{fill:none;stroke:var(--line);stroke-width:2}
svg.ln path.won{stroke:var(--accent)}
.cols{position:absolute;inset:22px 0 0;display:flex;gap:22px}
.col{flex:1 1 0;min-width:0;max-width:230px;display:flex;flex-direction:column;justify-content:space-around}
.col.fin{flex:0 0 184px;justify-content:center}
.cl{position:absolute;top:0;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.m .t:first-child{border-radius:5px 5px 0 0}.m .t:last-of-type{border-radius:0 0 5px 5px}
/* a long team name takes a second line in a smaller size rather than being cut */
.t{display:flex;align-items:center;gap:8px;min-height:34px;padding:3px 10px;box-sizing:border-box;font-size:14px;font-weight:500;line-height:1.2}
.t+.t{border-top:1px solid var(--line)}
.t .n{flex:1;min-width:0;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.t .n.long{font-size:12px}
.t.tbd .n{color:var(--mute);font-weight:400;font-size:13px}
.t.win{background:var(--accent);color:var(--on);font-weight:700}
.t.lose{color:var(--mute)}
.t .w{font-family:Oxanium;font-weight:800;font-size:15px}
/* decided on the field, not on air yet: a small flag on the box's top edge, never over a name */
.tag{position:absolute;right:8px;top:-10px;font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:10px;background:var(--ink);color:var(--bg)}
.fin .lab{text-align:center;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
.fin .m{border-color:var(--accent);border-width:2px}
.fin .t{min-height:44px;font-size:16px}
.fin .bo{text-align:center;font-family:Oxanium;font-size:12px;color:var(--mute);margin-top:8px;letter-spacing:.14em}
.champ{margin-top:12px;text-align:center;font-weight:700;font-size:15px;color:var(--accent)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:18px}
</style>
</head>
<body>
<div class="page" id="p"></div>
<script>
const opt=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
// the colours of each on-air theme, so the board sits in the same look as the graphics around it
const PAL={
  sports:{bg:'#0c1a3a',panel:'#13264d',line:'#2a3d66',ink:'#ffffff',mute:'#8fa3c7',accent:'#e2343c',on:'#ffffff'},
  esports:{bg:'#070d18',panel:'#0f1a2c',line:'#22324b',ink:'#e9f4ff',mute:'#7f93ad',accent:'#2fd3ff',on:'#04121c'},
  minimal:{bg:'#121a2a',panel:'#1a2336',line:'#2c3750',ink:'#f3f5f8',mute:'#8b96a8',accent:'#f5b82e',on:'#1a1406'},
  thaitv:{bg:'#0d2a6e',panel:'#163a8c',line:'#2c4fa6',ink:'#ffffff',mute:'#a9bbe6',accent:'#f08a1c',on:'#ffffff'},
  arcade:{bg:'#0b1028',panel:'#161d3d',line:'#2a3366',ink:'#ffffff',mute:'#8a93c0',accent:'#ffd23f',on:'#1b1400'},
  poster:{bg:'#13245e',panel:'#1b2f72',line:'#2f4590',ink:'#ffffff',mute:'#a6b2d8',accent:'#e1262d',on:'#ffffff'},
  blueprint:{bg:'#0b1113',panel:'#0f191c',line:'#1f3236',ink:'#e8f3f5',mute:'#7d9396',accent:'#35d3e8',on:'#031416'},
  playful:{bg:'#1d1b4a',panel:'#2c2a66',line:'#3d3a80',ink:'#ffffff',mute:'#a7a6d6',accent:'#ffd23f',on:'#1b1400'},
  cinema:{bg:'#0b0f17',panel:'#141a24',line:'#262e3b',ink:'#f3ede2',mute:'#8c8576',accent:'#d8b26a',on:'#16110a'},
  light:{bg:'#efede6',panel:'#ffffff',line:'#d6d3c8',ink:'#13234f',mute:'#6b7488',accent:'#1f3f9a',on:'#ffffff'}};
let data=null,idx=0,turn=null,theme='sports';
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e};
function paint(name){const p=PAL[name]||PAL.sports;for(const k in p)document.documentElement.style.setProperty('--'+k,p[k])}

// one match: two rows, the winner lit once the result has been on air; "รอชม" when it is decided but not shown yet
function box(m,fin){
  const b=el('div','m');
  for(const t of[m.a,m.b]){const r=el('div','t'+(!t||!t.name?' tbd':t.win===true?' win':t.win===false?' lose':''));
    const nm=t&&t.name?t.name:(t&&t.from?t.from:'รอคู่แข่ง');r.append(el('span','n'+(nm.length>18?' long':''),nm));
    if(fin&&t&&t.wins!=null)r.append(el('span','w',t.wins));
    b.append(r)}
  if(m.wait)b.append(el('span','tag','รอชม'));
  return b;
}
function draw(){
  const p=document.getElementById('p');p.classList.remove('on');
  setTimeout(()=>{try{drawNow(p)}catch(e){console.warn('board',e);p.textContent='';p.append(el('div','empty','ยังไม่มีสายการแข่ง'));p.classList.add('on')}},data?250:0);
}
function drawNow(p){{
    p.textContent='';
    const list=(data&&data.brackets)||[],br=list[idx%Math.max(1,list.length)];
    const hd=el('div','hd'),l=el('div');l.append(el('div','ey','สายการแข่ง · BRACKET'),el('div','tt',br?br.title:'สายการแข่ง'));hd.append(l);
    if(list.length>1){const d=el('div','dots');list.forEach((x,i)=>d.append(el('i',i===idx%list.length?'on':'')));hd.append(d)}
    const bd=el('div','bd');p.append(hd,bd);
    if(!br){bd.append(el('div','empty',data&&data.error?'ยังดึงสายการแข่งไม่ได้':'ยังไม่มีสายการแข่ง'));p.classList.add('on');return}
    // the two halves of the bracket face each other, the final between them (columns come from the outside in)
    const cols=el('div','cols'),mk=col=>{const c=el('div','col');c.dataset.label=col.label||'';col.matches.forEach(m=>{const x=box(m);x.dataset.id=m.id;x.dataset.next=m.next||'';x.dataset.won=m.done?'1':'';c.append(x)});return c};
    (br.left||[]).forEach(c=>cols.append(mk(c)));
    const fc=el('div','col fin');
    if(br.final){fc.append(el('div','lab',br.final.label||'รอบชิงชนะเลิศ'));const fm=box(br.final,true);fm.dataset.id='final';fc.append(fm);
      if(br.final.bestOf>1)fc.append(el('div','bo','BEST OF '+br.final.bestOf));
      if(br.final.champion)fc.append(el('div','champ','แชมป์ · '+br.final.champion))}
    cols.append(fc);
    [...(br.right||[])].reverse().forEach(c=>cols.append(mk(c)));
    bd.append(cols);
    // the round names above their columns, then the lines from each match to the one its winner goes to
    // a timer, not requestAnimationFrame: OBS does not paint a source that is not on screen
    setTimeout(()=>{const o=bd.getBoundingClientRect();
      cols.querySelectorAll('.col').forEach(c=>{if(!c.dataset.label)return;const r=c.getBoundingClientRect(),t=el('div','cl',c.dataset.label);t.style.left=(r.left-o.left)+'px';t.style.maxWidth=r.width+'px';bd.append(t)});
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','ln');
      cols.querySelectorAll('.m[data-next]').forEach(m=>{const to=m.dataset.next&&cols.querySelector(`.m[data-id="${CSS.escape(m.dataset.next)}"]`);if(!to)return;
        const a=m.getBoundingClientRect(),b=to.getBoundingClientRect(),rightward=b.left>a.left;
        const x1=(rightward?a.right:a.left)-o.left,y1=a.top+a.height/2-o.top,x2=(rightward?b.left:b.right)-o.left,y2=b.top+b.height/2-o.top,mx=(x1+x2)/2;
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1} ${y1}H${mx}V${y2}H${x2}`);if(m.dataset.won)path.setAttribute('class','won');svg.append(path)});
      bd.prepend(svg);p.classList.add("on")},30);
  }
}
function show(m){
  if(m.k==='theme'&&m.name){theme=m.name;paint(theme);return}
  if(m.k!=='board')return;
  if(m.theme&&m.theme!==theme){theme=m.theme;paint(theme)}
  const same=data&&JSON.stringify(data.brackets)===JSON.stringify(m.brackets);data=m;
  // more than one programme (ประถม, มัธยม): each gets the window in turn
  clearInterval(turn);if((m.brackets||[]).length>1)turn=setInterval(()=>{idx++;draw()},12000);
  if(!same||!document.getElementById('p').childElementCount)draw();
}
paint(theme);document.fonts.ready.then(()=>{if(!data)draw()});
// obs-websocket 5, as in overlay.html: hello → identify → the desk's custom events
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const sha=async s=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
function connect(){
  let ws;try{ws=new WebSocket(opt.ws||'ws://127.0.0.1:4455','obswebsocket.json')}catch(e){return}
  ws.onmessage=async e=>{const m=JSON.parse(e.data);
    if(m.op===0){const a=m.d.authentication;const d={rpcVersion:1,eventSubscriptions:1};
      if(a)d.authentication=await sha(await sha((opt.pw||'')+a.salt)+a.challenge);ws.send(JSON.stringify({op:1,d}))}
    else if(m.op===2)ws.send(JSON.stringify({op:6,d:{requestType:'BroadcastCustomEvent',requestId:'hi',requestData:{eventData:{pt:1,k:'hello'}}}}));
    else if(m.op===5&&m.d.eventType==='CustomEvent'&&m.d.eventData?.pt===1)show(m.d.eventData)};
  ws.onclose=e=>{if(e.code===4009)return;setTimeout(connect,2000)};
}
connect();
</script>
</body>
</html>
